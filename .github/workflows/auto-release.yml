name: Auto Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave blank to auto-generate, e.g. v0.4.9 or v1.1.3)'
        required: false
        default: ''
      release_title:
        description: 'Release Title (leave blank to use Tag name)'
        required: false
        default: ''
      is_draft:
        description: 'Create as Draft Release'
        type: boolean
        default: false
      is_prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false
      reason:
        description: 'Trigger reason (optional)'
        required: false
        default: 'Manual release trigger'
  workflow_run:
    workflows: ["Upstream Sync & Auto-Update"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build Packages & Create Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine Release Tag and Status
        id: get_tag
        run: |
          SHOULD_RELEASE="true"

          # 1. If triggered by git tag push
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="${TAG}"
            echo "Triggered by tag push: $TAG"

          # 2. If triggered manually via workflow_dispatch
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.tag_name }}" ]; then
              TAG="${{ github.event.inputs.tag_name }}"
            else
              TAG="v$(date +'%Y.%m.%d-%H%M')"
            fi

            if [ -n "${{ github.event.inputs.release_title }}" ]; then
              TITLE="${{ github.event.inputs.release_title }}"
            else
              TITLE="${TAG}"
            fi
            echo "Triggered manually: tag=$TAG title=$TITLE"

          # 3. If triggered by workflow_run (upstream sync)
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LATEST_TAG" ]; then
              COMMITS_SINCE=$(git rev-list "$LATEST_TAG..HEAD" --count)
              echo "Latest tag: $LATEST_TAG, commits since: $COMMITS_SINCE"
              if [ "$COMMITS_SINCE" -eq 0 ]; then
                echo "No new commits since $LATEST_TAG. Skipping auto release."
                SHOULD_RELEASE="false"
              else
                TAG="v$(date +'%Y.%m.%d')"
                if git rev-parse "$TAG" >/dev/null 2>&1; then
                  TAG="v$(date +'%Y.%m.%d-%H%M')"
                fi
                TITLE="Release $TAG (Sync Update)"
              fi
            else
              TAG="v0.4.8"
              TITLE="Release $TAG"
            fi
          fi

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Create Git Tag if Not Exists
        if: steps.get_tag.outputs.should_release == 'true'
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Creating git tag $TAG..."
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          else
            echo "Tag $TAG already exists."
          fi

      - name: Package Release Assets
        if: steps.get_tag.outputs.should_release == 'true'
        run: |
          chmod +x scripts/package.sh
          ./scripts/package.sh dist

      - name: Generate Release Notes
        if: steps.get_tag.outputs.should_release == 'true'
        run: |
          chmod +x scripts/generate-release-notes.sh
          ./scripts/generate-release-notes.sh "${{ steps.get_tag.outputs.tag }}" "${{ github.repository }}" release_notes.md dist

      - name: Publish GitHub Release
        if: steps.get_tag.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          TITLE="${{ steps.get_tag.outputs.title }}"

          EXTRA_FLAGS=()
          if [ "${{ github.event.inputs.is_draft }}" = "true" ]; then
            EXTRA_FLAGS+=("--draft")
          fi
          if [ "${{ github.event.inputs.is_prerelease }}" = "true" ]; then
            EXTRA_FLAGS+=("--prerelease")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Updating release and assets..."
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" \
              dist/* \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --generate-notes \
              "${EXTRA_FLAGS[@]}"
          fi

          echo "Release successfully published: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
