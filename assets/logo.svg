<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="embyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52B54B" />
      <stop offset="100%" stop-color="#00D26A" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52B54B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="184" height="184" rx="42" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Subtle glow aura -->
  <circle cx="85" cy="100" r="45" fill="#52B54B" opacity="0.12" filter="url(#glow)" />
  <circle cx="130" cy="70" r="35" fill="#38bdf8" opacity="0.15" filter="url(#glow)" />

  <!-- Play Symbol (Emby inspired) -->
  <path d="M 62 55
           C 62 50 67.5 47 71.8 49.5
           L 132 84.5
           C 136.2 87 136.2 93 132 95.5
           L 71.8 130.5
           C 67.5 133 62 130 62 125
           Z"
        fill="url(#embyGrad)" />

  <!-- Inner stylized cut / play highlight -->
  <path d="M 72 65 L 115 90 L 72 115 Z" fill="#ffffff" opacity="0.25" />

  <!-- External Launch Arrow badge in top-right -->
  <g transform="translate(108, 30)">
    <!-- Badge Background Circle -->
    <circle cx="28" cy="28" r="28" fill="#1e293b" stroke="url(#cyanGrad)" stroke-width="2.5" />
    
    <!-- Arrow Body & Head -->
    <path d="M 20 36 L 36 20 M 36 20 H 25 M 36 20 V 31"
          stroke="url(#cyanGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
